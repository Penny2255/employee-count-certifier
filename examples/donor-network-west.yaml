lesson: >
  Form 990 Part I line 5 is tier 2: dated, exact and company-filed, but it lags. The 2024
  return was signed 2025-11-06, so at this lookup the newest figure is 21 months old: Supported
  (3), not Certified, even though the 2023 return (518) agrees. Line 5 counts everyone issued a
  W-2 during the calendar year, including people who left, so it can run above point-in-time
  headcount in high-turnover organizations; log that as a nuance. The multi-year line 5 trend
  (404, 438, 449, 475, 518, 513 for 2019-2024) is directional evidence: steady growth that
  flattened in 2024. When a sound current signal exists (LinkedIn growth past the member-gap
  threshold), the growth adjustment may move a 990 figure that is over 18 months old toward
  it; here no such signal is recorded, so 513 stands.
