case: Subsidiary whose headcount is stated in the parent's combined 10-K
entity:
  name: Florida Power & Light Company
  website: "https://www.fpl.com"
  hq: "Juno Beach, FL, USA"
  legal_parent: "NextEra Energy, Inc."
  relationship_to_parent: wholly owned subsidiary
lookup_date: 2026-10-11
tags: [golden, tier-1, 10-K, subsidiary, combined-filing]
sources:
  - tier: 1
    url: https://www.sec.gov/Archives/edgar/data/753308/000075330826000015/nee-20251231.htm#fpl
    as_of_date: 2025-12-31
    excerpt: "FPL had approximately 9,400 employees as of December 31, 2025, with approximately 30% of these employees represented by the International Brotherhood of Electrical Workers (IBEW)."
expected: {certified_count: 9400, qualifier: approximately, count_type: reported, policy_tier: 1, confidence_score: 4}
lesson: >
  A parent's combined 10-K that states a subsidiary's own headcount is tier 1 for the
  subsidiary. Certify the parent separately (see nextera-energy.yaml); never use the
  parent total for the subsidiary.
