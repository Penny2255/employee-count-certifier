case: Undated website figure outgrown per LinkedIn growth (growth adjustment)
entity: {name: Gong, website: "https://www.gong.io", hq: "San Francisco, CA, USA"}
lookup_date: 2026-10-11
tags: [tier-4, website, undated, linkedin-growth, growth-adjustment, white-collar, private]
sources:
  - tier: 4
    url: https://www.gong.io/about/
    as_of_date: null
    value: 1500
    qualifier: exact
    excerpt: "1,500 Employees"   # animated stat tile on the About page, no date
linkedin:
  member_count: 2137             # Insights tab "Total employee count", Oct 2026 (user noted 2,127 on About)
  size_range: [1001, 5000]
  workforce_profile: white_collar
  growth_6m: 0.08
  growth_1y: 0.27
  growth_2y: 0.60
expected:
  certified_count: 2000
  qualifier: approximately
  count_type: estimated
  policy_tier: 4
  range: [1500, 2300]
  confidence_score: 3
lesson: >
  The website's 1,500 is undated, and LinkedIn shows 2,137 members with 27% one-year and 60%
  two-year growth, so 1,500 is an old data point (it matches the member count roughly 1-2
  years ago). Rather than certifying 1,500 or jumping to the member count, move conservatively
  toward it: 1,500 + 75% x (2,137 - 1,500) = 1,978, rounded to ~2,000, with a range from the
  stated 1,500 to the white-collar implied midpoint (~2,300). The size range 1,001-5,000
  agrees. Confidence is Supported (3): we are confident the true figure is about 2,000 or
  more, but no company source states it.
