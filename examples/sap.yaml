lesson: >
  A 20-F is tier 1, equal to a 10-K, and will be common for international companies.
  But the 20-F only says "more than 110,000"; SAP's Integrated Report 2025 (its full annual
  report, also tier 1, same as-of date) reports 112,234 on page 38. Always look for the full
  annual or integrated report alongside the regulatory filing. When a headline statement is
  rounded or qualified and a detailed statement or table for the same date is in line with
  it, the detailed figure wins and the headline corroborates it.
