# Employee Count Certifier policy. Every tunable value lives here; see SPEC.md.
policy_version: "0.2"

models:
  research: claude-sonnet-5-5
  extraction: claude-sonnet-5-5

budget:
  max_cost_usd_per_lookup: 0.50     # reserved in full against the beta allowances before each lookup
  research_stop_usd: 0.20           # research stops here, leaving room for its last turn and extraction
  max_web_searches_per_entity: 8
  max_web_searches_when_sec_filer: 4   # EDGAR already supplies tier 1
  max_web_fetches_per_entity: 4       # full-page reads (annual reports, About pages)
  fetch_max_content_tokens: 12000     # cap per fetched page
  effort: medium                      # Claude effort for research and extraction
  max_continuations: 3                # resumes after pause_turn
  # Basic tool versions: in live tests the dynamic-filtering versions (_20260209) spent the search
  # budget without returning provider pages; the basic versions found them in 2 searches.
  web_search_tool: web_search_20250305
  web_fetch_tool: web_fetch_20250910

# USD prices used to estimate spend per lookup (Anthropic list prices; update when they change).
pricing:
  models:
    claude-sonnet-5-5: {input_per_mtok: 2.00, output_per_mtok: 10.00, cache_read_per_mtok: 0.20}
    claude-opus-5-5: {input_per_mtok: 4.00, output_per_mtok: 20.00, cache_read_per_mtok: 0.20}
    claude-haiku-5-5: {input_per_mtok: 0.10, output_per_mtok: 0.50, cache_read_per_mtok: 0.01}
  web_search_per_1000: 10.00

# Corporate Fact Sheet: the company's official fact sheet or "company facts" page/PDF is primary,
# right behind 10-K/20-F/40-F and annual financial reports and above every website, press release,
# LinkedIn and third-party source. With no date at all it drops one tier (DECISIONS.md D54).
fact_sheet:
  tier: 2
  undated_tier: 3

# Tier number -> class. Lower tier number = higher rank.
tiers:
  1: {class: primary, name: "10-K, 20-F, 40-F or annual financial report"}
  2: {class: primary, name: "Corporate fact sheet, or non-financial annual or regulatory report"}
  3: {class: secondary, name: "Formal press release or company-published document"}
  4: {class: secondary, name: "Company website description"}
  5: {class: secondary, name: "LinkedIn company description"}
  6: {class: secondary, name: "Reputable third-party article quoting an executive"}
  7: {class: tertiary, name: "Best-of-breed data enrichment provider"}
  8: {class: tertiary, name: "Specialty source"}
  9: {class: unranked, name: "Other data provider or non-reputable news"}

recency:
  certified_max_age_months: 18   # tier 1-2 as-of date must be within this for Certified (4)
  stale_after_months: 24         # older dated sources are supporting evidence only
  # Lagging official releases (D76): the latest available release counts as current for recency, and is never
  # stale, until the next release is due: as-of date + these days + the grace below. Then normal rules apply.
  latest_release_current:
    ipeds: 765                   # staff as of Nov 1 of the fall collection; the next is released ~25 months later
  latest_release_grace_days: 60

agreement:
  corroborates_within: 0.15      # relative difference counted as agreeing
  conflict_above: 0.30           # relative difference counted as disagreeing
  # Corroboration needs an independent source near the same as-of date: restatements of the same
  # figure (Wikipedia, aggregators quoting the 10-K), the same document, and prior-year filings
  # don't count. Undated sources can't corroborate.
  corroboration_window_months: 9

# Indicated current range: when newer tier 7-9 data (e.g. quarterly Revelio) diverges from an old
# certified figure, show its range alongside the certified value. It never replaces the value.
indicated_range:
  min_anchor_age_months: 12
  max_source_age_months: 12
  min_newer_by_months: 3
  min_divergence: 0.05

# Tier 1 provenance: a tier 1 figure must come from sec.gov (with an accession number in the URL)
# or from the organization's own website. Copies elsewhere (Quartr, aggregators) are mirrors:
# they may corroborate but never set the value.
provenance:
  sec_hosts: [sec.gov]

confidence_levels:
  5: "Certified, corroborated"
  4: "Certified"
  3: "Supported"
  2: "Estimated"
  1: "Unverified"
  0: "Unattained"

# Range band around the certified value, as fractions [low, high] of the value.
range_bands:
  exact: [0.0, 0.0]
  approximately: [-0.05, 0.05]
  more_than: [0.0, 0.10]
  up_to: [-0.10, 0.0]

# Qualifier phrases recognized in source excerpts.
qualifier_phrases:
  more_than: ["more than", "over", "in excess of", "upwards of", "greater than"]
  approximately: ["approximately", "approx.", "about", "around", "roughly", "nearly", "almost", "some", "close to", "~"]
  up_to: ["up to", "fewer than", "less than", "under", "no more than"]

# Growth adjustment (examples: Gong, Donor Network West). An undated or old figure that current
# evidence shows the organization has outgrown is moved conservatively toward a current signal:
#   1. LinkedIn growth: member count above the figure, with visible headcount growth.
#   2. Data-provider consensus: recent tier 7-9 figures that agree with each other and all exceed
#      the figure; a LinkedIn member count that agrees with them joins as an input. Outliers
#      (beyond agreement.conflict_above from the median) are ignored.
# Tier 2 qualifies because filings like Form 990 lag 12-24 months; tier 1 (10-K, 20-F) and FTE
# figures never do. Data-provider figures never replace the selected value, only inform the move.
growth_adjustment:
  applies_to_tiers: [2, 3, 4, 5, 6]
  min_age_months:               # dated sources newer than this are left alone; undated always qualify
    primary: 18                 # i.e., only once no longer Certified
    secondary: 12
  min_member_gap: 0.15          # each signal input must exceed the stated value by at least this
  min_growth: 0.10              # signal 1: LinkedIn 1-year growth (else 2-year) at least this
  min_tertiary_sources: 2       # signal 2: at least this many recent tier 7-9 figures in agreement
  tertiary_max_age_months: 12   # signal 2: tier 7-9 figures dated within this window
  weight_toward_members: 0.75   # estimate = stated + weight x (target - stated); target = members or band mean
  round_to_significant: 2       # 1,978 -> 2,000
  confidence: 3                 # Supported: a company figure plus a consistent current signal

# Guidance for the research step (build step 3). Grows with reviewed cases in examples/.
research_guidelines:
  - >-
    When the only figures are data providers' (often LinkedIn-derived), look for company-tied statements that can
    corroborate them: executives interviewed by reputable press ("we're now about 4,000 people"), press releases,
    funding or office announcements, and the careers page. Record open job postings (careers page or LinkedIn
    jobs) in linkedin.open_roles: heavy hiring at a white-collar company is a growth signal.
  - >-
    Look for LinkedIn headcount growth (the Insights "6m / 1y / 2y growth" figures), often quoted in search
    results or third-party pages, and record it in linkedin.growth_6m, growth_1y and growth_2y. It feeds the
    forecast when history is short. Construction, manufacturing, retail, healthcare delivery and similar
    field workforces are blue_collar: most of their people aren't on LinkedIn, so a low member count is expected.
  - >-
    For tier 1, find both the regulatory filing (10-K, 20-F, 40-F) and the company's full annual
    or integrated report. The filing often rounds ("more than 110,000") while the full report has
    a detailed statement or table with the exact figure (SAP: 112,234).
  - >-
    Read the whole filing, not just the overview: the employee or human capital section often
    states a more specific figure than the business overview (Novo Nordisk: 69,505 vs. "more than 69,500").
  - >-
    Website stat tiles ("1,500 Employees") are usually undated and can be years old. Check them
    against the LinkedIn member count and Insights growth (Gong: 1,500 on the site vs. 2,137
    members and 27% one-year growth).
  - >-
    Nonprofits: use the latest Form 990 Part I line 5 (ProPublica Nonprofit Explorer), and collect
    prior years' line 5 for the trend. Expect a 12-24 month lag.
  - >-
    U.S. universities: use IPEDS Human Resources "Total all staff" (as of November 1 of the fall
    collection, about a year behind), certified as stated. Record graduate assistants and any
    affiliated health system as notes; don't add them.
  - >-
    Cities, counties and states: use the Annual Comprehensive Financial Report (ACFR), then the
    adopted budget. Record whether the figure is FTE or headcount, and whether it includes school
    systems. Look for a figure for the government's own workers without schools.
  - >-
    Look for the company's official Corporate Fact Sheet (a "fact sheet" or "company facts" page or
    PDF, often in the newsroom or investor relations section). It is tier 2: behind the 10-K and
    annual report, ahead of the website, press releases and LinkedIn.
  - >-
    Trend: also capture the organization's headcount for each of the prior 3-4 years, from the same
    kind of source as the main figure where possible (earlier annual reports or 10-Ks, earlier Form
    990s, earlier press-release boilerplate, archived About pages, dated news). Report each as its own
    figure with its own as-of date; they chart the trend and are never the certified value.
  - >-
    Capture each figure's verbatim excerpt and its as-of date, and record segment or regional
    figures as partial scope.

# LinkedIn members as a fraction of true headcount, by workforce profile.
linkedin:
  default_profile: mixed
  # Members may exceed the certified count by this much and still pass (profiles of former
  # employees and contractors linger). The member count is a flag, never a floor.
  member_overage_tolerance:
    white_collar: 0.30
    mixed: 0.25
    blue_collar: 0.25
  # A LinkedIn flag lowers confidence only when the gap is at least this large (members at least double the
  # certified count, or the count at least double the range the members imply) and the key source isn't a
  # current tier 1-2 filing. Smaller gaps, or a current filing, are reported as worth knowing with no penalty.
  penalty_gap: 1.0
  # A fast-growing white-collar organization (LinkedIn growth or open roles below) is well represented on
  # LinkedIn, so its member count is a floor: at least this share of members are current employees. A weaker
  # estimate below the floor moves to the middle of floor..members. Only for estimates from data providers
  # or a tier 4-6 anchor; filings and company-published documents (tiers 1-3) stand.
  growth_floor_share: 0.75
  growth_signal_1y: 0.25         # LinkedIn 1-year headcount growth of at least this
  growth_signal_2y: 0.50         # or 2-year growth of at least this
  growth_signal_open_roles: 0.05 # or open roles of at least this share of members
  growth_forecast_cap: 0.30      # with a growth signal, the forecast may carry up to this much a year
  profiles:
    white_collar: {members_per_employee: [0.90, 0.95]}
    mixed: {members_per_employee: [0.50, 0.90]}
    blue_collar: {members_per_employee: [0.25, 0.50]}
