[project]
name = "certifier"
version = "0.1.0"
description = "Certified global employee counts per a documented source policy, served over MCP"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.14.0",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
]

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
