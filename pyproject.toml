[project]
name = "certifier"
version = "0.1.0"
description = "Certified global employee counts per a documented source policy, served over MCP"
requires-python = ">=3.12"
license = "LicenseRef-Proprietary"
license-files = ["LICENSE"]
authors = [{ name = "Matthew Beltrano" }]
classifiers = ["Private :: Do Not Upload"]
dependencies = [
    "anthropic>=1.13.0",
    "fastapi>=0.143.0",
    "mcp>=2.3.0",
    "pydantic>=2.14.0",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.4",
    "python-pptx>=1.0.2",
    "pyyaml>=6.0.3",
    "tzdata>=2026.5",
]

[project.scripts]
certifier-mcp = "certifier.server:main"
certifier-card = "certifier.card:main"
certifier-access = "certifier.access:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
